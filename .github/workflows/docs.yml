name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "hooks/**"
      - "mkdocs.yml"
      - "tracks/risk_fraud_copilot/README.md"
      - "tracks/risk_fraud_copilot/coco/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
      - run: mkdocs gh-deploy --force
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
